version: '3.8'

services:
  youtube-mcp-server:
    build:
      context: ./servers/youtube
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
      cache_from:
        - youtube-ai-platform-youtube-mcp-server:latest
    container_name: youtube-mcp-server
    ports:
      - "8001:8001"
    volumes:
      - ./servers/youtube:/app
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - PYTHONPATH=/app
    command: python youtube_mcp_server.py
    networks:
      - youtube-ai-network
    restart: unless-stopped

  video-mcp-server:
    build:
      context: ./servers/video
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
      cache_from:
        - youtube-ai-platform-video-mcp-server:latest
    container_name: video-mcp-server
    ports:
      - "8002:8002"
    volumes:
      - ./servers/video:/app
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - PYTHONPATH=/app
    command: python video_mcp_server.py --http
    networks:
      - youtube-ai-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
      cache_from:
        - youtube-ai-platform-backend:latest
    container_name: youtube-ai-backend
    ports:
      - "3000:8080"
    volumes:
      - ./backend/static:/app/static
      - ./servers:/app/servers
      - ./uploads:/app/uploads
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - RUST_LOG=info
    depends_on:
      - youtube-mcp-server
      - video-mcp-server
    networks:
      - youtube-ai-network
    restart: unless-stopped

networks:
  youtube-ai-network:
    driver: bridge

volumes:
  uploads:
  shared_data:
